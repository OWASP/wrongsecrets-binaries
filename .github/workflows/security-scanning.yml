---
name: "Security Scanning"

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Analysis (Non-Swift)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp', 'go', 'csharp', 'java', 'rust']
        include:
          - language: 'c-cpp'
            build-mode: manual
          - language: 'go'
            build-mode: autobuild
          - language: 'csharp'
            build-mode: manual
          - language: 'java'
            build-mode: manual
          - language: 'rust'
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Rust
        if: matrix.language == 'rust'
        run: rustup update stable && rustup default stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Manual build for .NET
        if: matrix.language == 'csharp'
        run: |
          cd dotnet/dotnetproject
          dotnet restore
          dotnet build

      - name: Manual build for C/C++
        if: matrix.language == 'c-cpp'
        run: |
          # Build C projects
          gcc c/main.c -o c/main
          gcc c/advanced/advanced.c -o c/advanced/advanced
          gcc c/challenge52/main.c -o c/challenge52/main
          # Build C++ projects
          g++ cplus/main.cpp -o cplus/main

      - name: Manual build for Java
        if: matrix.language == 'java'
        run: |
          cd java/plain
          ./mvnw compile -q
          cd ../obfuscated
          ./mvnw compile -q

      - name: Manual build for Rust
        if: matrix.language == 'rust'
        run: |
          cd rust
          cargo build --release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: "/language:${{matrix.language}}"

  codeql-swift-analysis:
    name: CodeQL Analysis (Swift)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['swift']
        include:
          - language: 'swift'
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Swift
        if: matrix.language == 'swift'
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9
        with:
          swift-version: '6.2.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Manual build for Swift
        if: matrix.language == 'swift'
        run: |
          cd swift
          swift build -c release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: "/language:${{matrix.language}}"

  semgrep-analysis:
    name: Semgrep Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --sarif \
            --output semgrep.sarif \
            . || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          sarif_file: semgrep.sarif
        if: always()
