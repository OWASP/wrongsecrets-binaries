---
name: "Security Scanning"

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp', 'go', 'csharp', 'java', 'swift']
        include:
          - language: 'c-cpp'
            build-mode: manual
          - language: 'go'
            build-mode: autobuild
          - language: 'csharp'
            build-mode: manual
          - language: 'java'
            build-mode: manual
          - language: 'swift'
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@0a324716f4a08855640c3b84444f1c073640467c
        with:
          go-version: '1.27'

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@4d25373106b3590a54884b653e44f032993b9992
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@6a08014250a86049549578a6b2f8b8576c8c8d77
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Swift
        if: matrix.language == 'swift'
        uses: SwiftyLab/setup-swift@12758430390499470339229868715a7651451d0b
        with:
          swift-version: '6.2.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f530319d8c989665d0835536ec9571735fd2008
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Manual build for .NET
        if: matrix.language == 'csharp'
        run: |
          cd dotnet/dotnetproject
          dotnet restore
          dotnet build

      - name: Manual build for C/C++
        if: matrix.language == 'c-cpp'
        run: |
          # Build C projects
          gcc c/main.c -o c/main
          gcc c/advanced/advanced.c -o c/advanced/advanced
          gcc c/challenge52/main.c -o c/challenge52/main
          # Build C++ projects
          g++ cplus/main.cpp -o cplus/main

      - name: Manual build for Java
        if: matrix.language == 'java'
        run: |
          cd java/plain
          ./mvnw compile -q
          cd ../obfuscated
          ./mvnw compile -q

      - name: Manual build for Swift
        if: matrix.language == 'swift'
        run: |
          cd swift
          swift build -c release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f530319d8c989665d0835536ec9571735fd2008
        with:
          category: "/language:${{matrix.language}}"

  semgrep-analysis:
    name: Semgrep Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --sarif \
            --output semgrep.sarif \
            . || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@6f530319d8c989665d0835536ec9571735fd2008
        with:
          sarif_file: semgrep.sarif
        if: always()
