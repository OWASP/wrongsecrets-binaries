---
name: "Security Scanning"

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp', 'go', 'csharp']
        include:
          - language: 'c-cpp'
            build-mode: manual
          - language: 'go'
            build-mode: autobuild
          - language: 'csharp'
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Manual build for .NET
        if: matrix.language == 'csharp'
        run: |
          cd dotnet/dotnetproject
          dotnet restore
          dotnet build

      - name: Manual build for C/C++
        if: matrix.language == 'c-cpp'
        run: |
          # Build C projects
          gcc c/main.c -o c/main
          gcc c/advanced/advanced.c -o c/advanced/advanced
          gcc c/challenge52/main.c -o c/challenge52/main
          # Build C++ projects
          g++ cplus/main.cpp -o cplus/main

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: "/language:${{matrix.language}}"

  semgrep-analysis:
    name: Semgrep Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --sarif \
            --output semgrep.sarif \
            . || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          sarif_file: semgrep.sarif
        if: always()
