---
name: "Security Scanning"

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp', 'go', 'csharp', 'java', 'rust', 'swift']
        include:
          - language: 'c-cpp'
            build-mode: manual
            runs-on: ubuntu-latest
          - language: 'go'
            build-mode: autobuild
            runs-on: ubuntu-latest
          - language: 'csharp'
            build-mode: manual
            runs-on: ubuntu-latest
          - language: 'java'
            build-mode: manual
            runs-on: ubuntu-latest
          - language: 'rust'
            build-mode: autobuild
            runs-on: ubuntu-latest
          - language: 'swift'
            build-mode: manual
            runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Swift
        if: matrix.language == 'swift'
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9
        with:
          swift-version: '6.2.0'

      - name: Setup Rust
        if: matrix.language == 'rust'
        run: rustup update stable && rustup default stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Manual build for .NET
        if: matrix.language == 'csharp'
        run: |
          cd dotnet/dotnetproject
          dotnet restore
          dotnet build

      - name: Manual build for C/C++
        if: matrix.language == 'c-cpp'
        run: |
          # Build C projects
          gcc c/main.c -o c/main
          gcc c/advanced/advanced.c -o c/advanced/advanced
          gcc c/challenge52/main.c -o c/challenge52/main
          # Build C++ projects
          g++ cplus/main.cpp -o cplus/main

      - name: Manual build for Java
        if: matrix.language == 'java'
        run: |
          cd java/plain
          ./mvnw compile -q
          cd ../obfuscated
          ./mvnw compile -q

      - name: Manual build for Swift
        if: matrix.language == 'swift'
        run: |
          cd swift
          swift build -c release

      - name: Manual build for Rust
        if: matrix.language == 'rust'
        run: |
          cd rust
          cargo build --release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: "/language:${{matrix.language}}"

  semgrep-analysis:
    name: Semgrep Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --sarif \
            --output semgrep.sarif \
            . || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: semgrep.sarif
        if: always()
